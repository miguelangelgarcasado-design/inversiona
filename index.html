function formatoNumero(numero, decimales = 2) {
  if (Math.abs(Number(numero)) > 0 &&
      Math.abs(Number(numero)) < 0.01) {
    decimales = 8;
  }

  return Number(numero).toLocaleString("es-ES", {
    minimumFractionDigits: decimales,
    maximumFractionDigits: decimales
  });
}


async function obtenerPrecio(ticker) {
  const res = await fetch(
    "/api/quote?symbol=" + encodeURIComponent(ticker),
    { cache: "no-store" }
  );

  if (!res.ok) {
    throw new Error("Error HTTP " + res.status);
  }

  const data = await res.json();
  const precio = Number(data.price);

  if (!Number.isFinite(precio) || precio <= 0) {
    throw new Error("Precio no disponible");
  }

  return precio;
}
 async function obtenerAnalisis(ticker) {
  const res = await fetch(
    "/api/quote?symbol=" + encodeURIComponent(ticker),
    { cache: "no-store" }
  );

  if (!res.ok) {
    throw new Error("Error al obtener análisis");
  }

  return await res.json();
}

    else if (r >= 30 && r < 35) puntos += 6;
  }

  if (a.macd != null && a.macdSignal != null) {
    const m = Number(a.macd);
    const s = Number(a.macdSignal);
    if (Number.isFinite(m) && Number.isFinite(s)) {
      maximo += 25;
      if (m > 0 && m > s) puntos += 25;
      else if (m > s) puntos += 15;
      else if (m > 0) puntos += 10;
    }
  }

  if (a.adx14 != null && Number.isFinite(Number(a.adx14))) {
    maximo += 15;
    const adx = Number(a.adx14);
    if (adx >= 25 && a.tendencia === "ALCISTA") puntos += 15;
    else if (adx >= 20 && a.tendencia === "ALCISTA") puntos += 8;
    else if (adx < 20) puntos += 4;
  }

  if (a.volumenActual != null && a.volumenMedio20 > 0) {
    maximo += 15;
    const ratio = Number(a.volumenActual) / Number(a.volumenMedio20);
    if (Number.isFinite(ratio)) {
      if (ratio >= 1.2 && a.tendencia === "ALCISTA") puntos += 15;
      else if (ratio >= 1 && a.tendencia === "ALCISTA") puntos += 10;
      else if (ratio >= 0.8) puntos += 5;
    }
  }

  if (maximo < 70) return "⚪ Puntuación: datos insuficientes";

  const nota = Math.round(puntos / maximo * 100);
  const color = nota >= 70 ? "🟢" : nota >= 40 ? "🟡" : "🔴";

  return color + " PUNTUACIÓN TÉCNICA: " + nota +
    "/100 — " + (nota >= 70 ? "Fortaleza técnica" :
    nota >= 40 ? "Señales mixtas" : "Debilidad técnica");
})()}

async function cargarNoticias() {
  const contenedor =
    document.getElementById("noticiasDinamicas");

  try {
    const res = await fetch(
      "/api/news",
      { cache: "no-store" }
    );

    if (!res.ok) {
      throw new Error("Error HTTP " + res.status);
    }

    const data = await res.json();

    if (
      !data.ok ||
      !Array.isArray(data.noticias) ||
      data.noticias.length === 0
    ) {
      contenedor.innerHTML =
        "<p>No hay noticias disponibles ahora.</p>";
      return;
    }

    contenedor.innerHTML =
      data.noticias.map(n => `
        <div style="margin-bottom:18px;">
        <a href="${n.url || '#'}" target="_blank" rel="noopener noreferrer" style="color:white;text-decoration:none;"><strong>${n.titular || ""}</strong></a><br>
        <span class="muted">${n.fuente || ""}${n.fecha && new Date(n.fecha).getFullYear() > 2000 ? " · " + new Date(n.fecha).toLocaleDateString("es-ES") : ""}</span>
        </div>
      `).join("");

  } catch (error) {
    console.error("Error cargando noticias", error);

    contenedor.innerHTML =
      "<p>No se pudieron cargar las noticias.</p>";
  }
}
