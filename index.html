function formatoNumero(numero, decimales = 2) {
  if (Math.abs(Number(numero)) > 0 && Math.abs(Number(numero)) < 0.01) decimales = 8;
  return Number(numero).toLocaleString("es-ES", {
    minimumFractionDigits: decimales,
    maximumFractionDigits: decimales
  });
}

async function obtenerPrecio(ticker) {
  const res = await fetch(
    "/api/quote?symbol=" + encodeURIComponent(ticker),
    { cache: "no-store" }
  );

  if (!res.ok) {
    throw new Error("Error HTTP " + res.status);
  }

  const data = await res.json();
  const precio = Number(data.price);

  if (!Number.isFinite(precio) || precio <= 0) {
    throw new Error("Precio no disponible");
  }

  return precio;
}
 async function obtenerAnalisis(ticker) {
  const res = await fetch(
    "/api/quote?symbol=" + encodeURIComponent(ticker),
    { cache: "no-store" }
  );

  if (!res.ok) {
    throw new Error("Error al obtener análisis");
  }

  return await res.json();
}
 

async function cargarDatos() {
  const lista = document.getElementById("listaActivos");
  const alertasDinamicas = document.getElementById("alertasDinamicas");

  lista.innerHTML = "";

  let eurUsd = 1;

  try {
    eurUsd = await obtenerPrecio("EURUSD");

    if (!Number.isFinite(eurUsd) || eurUsd <= 0) {
      eurUsd = 1;
    }
  } catch (error) {
    console.error("No se pudo obtener EUR/USD", error);
    eurUsd = 1;
  }

  let totalInvertidoEUR = 0;
  let totalActualEUR = 0;
  let posicionesGanadoras = 0;
  let posicionesPerdedoras = 0;
  let posicionesCalculadas = 0;

  const alertas = [];

  for (const activo of activos) {
    const div = document.createElement("div");
    div.className = "activo";

    try {
     const alertasAntes = alertas.length;
     const regla = reglas[activo.ticker]; 
      const precioNumero = await obtenerPrecio(activo.ticker);
      const unidades = activo.titulos ?? activo.cantidad;

      const invertido = unidades * activo.compra;
      const valorActual = unidades * precioNumero;
      const beneficio = valorActual - invertido;
      const porcentaje = invertido !== 0
        ? (beneficio / invertido) * 100
        : 0;
if (regla) {
    const porcentajeTexto =
        (porcentaje >= 0 ? "+" : "") + formatoNumero(porcentaje) + "%";

    let colorAlerta = "🟡";
    let estado = "MANTENER";
    let recomendacion = regla.accion || "";

    recomendacion = recomendacion.replace(/^MANTENER;\s*/i, "");

    // 1. RIESGO ALTO: caída igual o superior al 35 %
    if (porcentaje <= -35) {
        colorAlerta = "🔴";
        estado = "RIESGO ALTO";

        // Conservamos la recomendación específica de cada activo.
        // No marcamos una gran caída automáticamente como compra.
        if (!recomendacion) {
            recomendacion = "REVISAR; NO AMPLIAR AHORA";
        }

    // 2. OBJETIVO DE VENTA ALCANZADO
    } else if (precioNumero >= regla.venta) {
        colorAlerta = "🔴";
        estado = "OBJETIVO ALCANZADO";
        recomendacion = "VALORAR VENTA / RECOGER BENEFICIOS";

    // 3. BENEFICIO IMPORTANTE
    } else if (porcentaje >= 30) {
        colorAlerta = "🟠";
        estado = "BENEFICIO IMPORTANTE";

        if (!recomendacion) {
            recomendacion = "VIGILAR / VALORAR BENEFICIOS PARCIALES";
        }

    // 4. DECISIÓN DE COMPRA / ESPERA
} else if (precioNumero <= regla.compra) {

    const distanciaCompra =
        ((regla.compra - precioNumero) / regla.compra) * 100;

    if (porcentaje <= -35) {
        colorAlerta = "🔴";
        estado = "NO COMPRAR TODAVÍA";
        recomendacion = "CAÍDA MUY FUERTE; ESPERAR ESTABILIZACIÓN";

    } else if (porcentaje <= -20) {
        colorAlerta = "🟡";
        estado = "VIGILAR";
        recomendacion = "CERCA DE COMPRA; ESPERAR CONFIRMACIÓN";

    } else if (distanciaCompra >= 5) {
        colorAlerta = "🟢";
        estado = "OPORTUNIDAD DE COMPRA";
        recomendacion = "PRECIO POR DEBAJO DE LA ZONA DE COMPRA";

    } else {
        colorAlerta = "🟢";
        estado = "ZONA DE COMPRA";
        recomendacion = "VALORAR COMPRA / AMPLIAR";
    }


// 5. SITUACIÓN NORMAL
} else {
    colorAlerta = "🟡";
    estado = "MANTENER";

    if (!recomendacion) {
        recomendacion = "MANTENER / VIGILAR";
    }
}


   alertas.push(
  colorAlerta + " " + activo.nombre +
  " — " + estado + " (" + porcentajeTexto + ")" +
  "\n➡️ " + recomendacion +
  "\n💰 Precio: " + formatoNumero(precioNumero) + " " + activo.moneda +
"\n🛒 Compra: " + formatoNumero(activo.compra) + " " + activo.moneda +
"\n🎯 Objetivo: " + formatoNumero(regla.venta) + " " + activo.moneda

);

}

      posicionesCalculadas++;

      if (beneficio >= 0) {
        posicionesGanadoras++;
      } else {
        posicionesPerdedoras++;
      }

      let invertidoEUR = invertido;
      let actualEUR = valorActual;

      if (activo.moneda === "$") {
        invertidoEUR = invertido / eurUsd;
        actualEUR = valorActual / eurUsd;
      }

      totalInvertidoEUR += invertidoEUR;
      totalActualEUR += actualEUR;

     

     

      const color =
        beneficio >= 0 ? "#86efac" : "#fca5a5";

      const signo =
        beneficio >= 0 ? "+" : "";

      div.innerHTML = `
        <strong>${activo.nombre}</strong>
        <span class="muted"> (${activo.ticker})</span><br>

        <span class="precio">
          ${formatoNumero(precioNumero)} ${activo.moneda}
        </span>

        <div style="margin-top:8px;">
          Cantidad: ${unidades.toLocaleString("es-ES")}<br>
          Precio compra: ${formatoNumero(activo.compra)} ${activo.moneda}<br>
          Invertido: ${formatoNumero(invertido)} ${activo.moneda}<br>
          Valor actual: ${formatoNumero(valorActual)} ${activo.moneda}<br>

          <span style="color:${color};font-weight:bold;">
            PyG: ${signo}${formatoNumero(beneficio)} ${activo.moneda}
            (${signo}${formatoNumero(porcentaje)}%)
          </span>
        </div>
      `;


// Si ninguna regla anterior ha generado alerta para este activo,
// mostramos MANTENER para que todos tengan una indicación.
const nombreAlerta = activo.nombre || activo.ticker;
const yaTieneAlerta = alertas.length > alertasAntes;

if (!yaTieneAlerta) {
  alertas.push(
    "🟡 " + nombreAlerta + ": MANTENER - " +
    formatoNumero(precioNumero) + " " + activo.moneda
  );
}

    } catch (error) {
      console.error("Error en " + activo.ticker, error);

      div.innerHTML = `
        <strong>${activo.nombre}</strong>
        <span class="muted"> (${activo.ticker})</span><br>
        <span class="negativo">Sin datos</span>
      `;
    }

    lista.appendChild(div);
  }

  const totalPyGEUR =
    totalActualEUR - totalInvertidoEUR;

  const porcentajeTotal =
    totalInvertidoEUR !== 0
      ? (totalPyGEUR / totalInvertidoEUR) * 100
      : 0;

  const valorCartera =
    document.getElementById("valorCartera");

  const invertidoCartera =
    document.getElementById("invertidoCartera");

  const gananciaCartera =
    document.getElementById("gananciaCartera");

  const resumenPosiciones =

  valorCartera.textContent =
    formatoNumero(totalActualEUR) + " €";

  invertidoCartera.textContent =
    "Total invertido: " +
    formatoNumero(totalInvertidoEUR) +
    " €";

  const signoTotal =
    totalPyGEUR >= 0 ? "+" : "";

  gananciaCartera.textContent =
    signoTotal +
    formatoNumero(totalPyGEUR) +
    " € (" +
    signoTotal +
    formatoNumero(porcentajeTotal) +
    "%)";

  gananciaCartera.style.color =
    totalPyGEUR >= 0
      ? "#86efac"
      : "#fca5a5";

  resumenPosiciones.innerHTML =
    "🟢 Ganadoras: " +
    posicionesGanadoras +
    "&nbsp;&nbsp;&nbsp; 🔴 Perdedoras: " +
    posicionesPerdedoras +
    "<br><span class='muted'>Posiciones calculadas: " +
    posicionesCalculadas +
    " de " +
    activos.length +
    "</span>";

 const gruposAlertas = {
  compra: [],
  riesgo: [],
  beneficio: [],
  mantener: []

alertas.forEach(alerta => {
  if (alerta.includes("ZONA DE COMPRA")) {
    gruposAlertas.compra.push(alerta);

    alerta.includes("RIESGO ALTO") ||
    alerta.includes("NO AMPLIAR") ||
    alerta.includes("NO PROMEDIAR")
  ) {
    gruposAlertas.riesgo.push(alerta);
  } else if (
    alerta.includes("OBJETIVO ALCANZADO") ||
    alerta.includes("BENEFICIO IMPORTANTE")
  ) {
    gruposAlertas.beneficio.push(alerta);
  } else {
    gruposAlertas.mantener.push(alerta);
  }
});

function crearGrupo(titulo, lista) {
  if (lista.length === 0) return "";

  return (
    '<div style="margin-top:18px;">' +
      '<strong style="font-size:20px;">' + titulo + '</strong>' +
      '<div style="margin-top:12px;display:grid;gap:12px;">' +
        lista.map(alerta =>
          '<div style="background:rgba(255,255,255,0.05);' +
          'border:1px solid rgba(255,255,255,0.10);' +
          'border-radius:12px;padding:14px;line-height:1.55;">' +
          alerta.replace(/\n/g, "<br>") +
          '</div>'
        ).join("") +
      '</div>' +
    '</div>'
  );
}

if (alertas.length > 0) {
  alertasDinamicas.innerHTML =
    crearGrupo("🟢 Oportunidades de compra", gruposAlertas.compra) +
    crearGrupo("🔴 Riesgo / revisar", gruposAlertas.riesgo) +
    crearGrupo("🟠 Beneficios / objetivos", gruposAlertas.beneficio) +
    crearGrupo("🟡 Mantener / vigilar", gruposAlertas.mantener);
} else {
  alertasDinamicas.innerHTML =
    '<span class="muted">✅ Sin movimientos destacados ahora mismo.</span>';
}


}

async function cargarNoticias() {
  const contenedor =
    document.getElementById("noticiasDinamicas");

  try {
    const res = await fetch(
      "/api/news",
      { cache: "no-store" }
    );

    if (!res.ok) {
      throw new Error("Error HTTP " + res.status);
    }

    const data = await res.json();

    if (
      !data.ok ||
      !Array.isArray(data.noticias) ||
      data.noticias.length === 0
    ) {
      contenedor.innerHTML =
        "<p>No hay noticias disponibles ahora.</p>";
      return;
    }

    contenedor.innerHTML =
      data.noticias.map(n => `
        <div style="margin-bottom:18px;">
        <a href="${n.url || '#'}" target="_blank" rel="noopener noreferrer" style="color:white;text-decoration:none;"><strong>${n.titular || ""}</strong></a><br>
        <span class="muted">${n.fuente || ""}${n.fecha && new Date(n.fecha).getFullYear() > 2000 ? " · " + new Date(n.fecha).toLocaleDateString("es-ES") : ""}</span>
        </div>
      `).join("");

  } catch (error) {
    console.error("Error cargando noticias", error);

    contenedor.innerHTML =
      "<p>No se pudieron cargar las noticias.</p>";
  }
}

cargarNoticias();
window.addEventListener("DOMContentLoaded", cargarDatos);
